models:
  - name: airports_silver
    columns:
      - name: airport_id
        data_tests:
          - unique
          - not_null
      - name: city
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null

  - name: bookings_silver
    columns:
      - name: booking_id
        data_tests:
          - unique
          - not_null
      - name: passenger_id
        data_tests:
          - not_null
      - name: flight_id
        data_tests:
          - not_null
        
  - name: passenger_silver
    columns:
      - name: passenger_id
        data_tests:
          - unique
          - not_null
      - name: nationaliy  # Note: You may want to double-check if this typo exists in your database column (nationality)
        data_tests:
          - not_null
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female']
